[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# На Netlify страница "/" отдаётся статикой, и redirect() из app/page.tsx
# превращается в 307 без заголовка Location. Редирект задаётся на уровне
# edge, чтобы он отдавался с корректным Location.
[[redirects]]
  from = "/"
  to = "/feed"
  status = 301

# Проекты — подраздел Журнала. Старый адрес отдаём редиректом на новую
# вкладку, иначе пользователь из закладок или из внешней ссылки попал бы
# в 404.
[[redirects]]
  from = "/projects"
  to = "/articles?tab=projects"
  status = 301
